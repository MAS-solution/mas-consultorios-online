/* ---------- fusión (compu, tablet y celu guardando a la vez) ---------- */
const LISTAS=['P','E','T','A','V','Ob','S'];
function fusLista(b,m,s){const ib=new Map(),im=new Map();(b||[]).forEach(x=>ib.set(String(x.id),x));(m||[]).forEach(x=>im.set(String(x.id),x));
  const out=new Map();(s||[]).forEach(x=>out.set(String(x.id),x));
  for(const[k,x]of im){if(!ib.has(k))out.set(k,x);else if(JSON.stringify(x)!==JSON.stringify(ib.get(k)))out.set(k,x)}
  for(const k of ib.keys())if(!im.has(k)){const sx=out.get(k);if(sx&&JSON.stringify(sx)===JSON.stringify(ib.get(k)))out.delete(k)}
  return [...out.values()]}
function fusionar(base,mio,suyo){base=base||VACIO();mio=mio||VACIO();suyo=suyo||VACIO();
  const out=Object.assign({},suyo);for(const k of LISTAS)out[k]=fusLista(base[k],mio[k],suyo[k]);
  const bc=base.cfg||{},mc=mio.cfg||{},sc=suyo.cfg||{},cfg=Object.assign({},sc);
  for(const k of new Set([...Object.keys(mc),...Object.keys(bc)])){if(JSON.stringify(mc[k])!==JSON.stringify(bc[k])){if(k in mc)cfg[k]=mc[k];else delete cfg[k]}}
  out.cfg=cfg;out.v=suyo.v||mio.v||1;return out}

/* ---------- Google: identidad (Supabase) + permiso de Drive ---------- */
function iniciarTokenCliente(){if(tokCli||!window.google||!google.accounts||!google.accounts.oauth2)return;
  tokCli=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SCOPES,
    callback:r=>{const cb=tokCb;tokCb=null;if(r&&r.access_token){GTOK=r.access_token;GEXP=Date.now()+((+r.expires_in||3600)-120)*1000;guardarTok();cb&&cb.ok()}else cb&&cb.err(new Error((r&&r.error)||'Google no dio permiso.'))},
    error_callback:e=>{const cb=tokCb;tokCb=null;cb&&cb.err(new Error(e&&e.type==='popup_closed'?'Se cerró la ventana de Google.':'No se pudo conectar con Google.'))}})}
function pedirToken(primera){iniciarTokenCliente();
  return new Promise((ok,err)=>{if(!tokCli){err(new Error('Google todavía no cargó. Probá de nuevo en unos segundos.'));return}
    tokCb={ok,err};tokCli.requestAccessToken({prompt:primera?'consent':'',login_hint:EMAIL||undefined})})}
async function g(metodo,url,cuerpo,headers){
  if(!GTOK||Date.now()>GEXP){olvidarTok();throw new Error('reconectar')}
  const r=await fetch(url,{method:metodo,headers:Object.assign({Authorization:'Bearer '+GTOK},headers||{}),body:cuerpo});
  if(r.status===401){olvidarTok();throw new Error('reconectar')}
  if(!r.ok){let t='';try{t=(await r.text()).slice(0,400)}catch(e){}
    if(/storageQuotaExceeded/i.test(t))throw new Error('drive-lleno');   // Drive sin espacio
    throw new Error('Google Drive '+r.status+(t?': '+t.slice(0,200):''))}
  if(r.status===204)return null;
  if(url.includes('alt=media'))return r;  // descarga de archivo: se devuelve la respuesta tal cual (la lee quien llama)
  return (r.headers.get('content-type')||'').includes('json')?r.json():r}
const qEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function buscarArch(q,campos){const j=await g('GET',DAPI+'/files?spaces=drive&pageSize=1000&orderBy=name%20desc&fields='+encodeURIComponent('files('+(campos||'id,name,version,modifiedTime')+')')+'&q='+encodeURIComponent(q+' and trashed=false'));return j.files||[]}
async function carpeta(nombre,padre){
  const f=await buscarArch(`name='${qEsc(nombre)}' and mimeType='application/vnd.google-apps.folder'`+(padre?` and '${padre}' in parents`:` and 'root' in parents`));
  if(f.length)return f[0].id;
  const j=await g('POST',DAPI+'/files?fields=id',JSON.stringify({name:nombre,mimeType:'application/vnd.google-apps.folder',parents:[padre||'root']}),{'Content-Type':'application/json'});
  return j.id}
async function subirDrive(meta,blob,id,campos){const b='mas'+Math.random().toString(36).slice(2);
  const cuerpo=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${blob.type||'application/octet-stream'}\r\n\r\n`,blob,`\r\n--${b}--`]);
  return g(id?'PATCH':'POST',UAPI+'/files'+(id?'/'+id:'')+'?uploadType=multipart&fields='+(campos||'id,version,modifiedTime'),cuerpo,{'Content-Type':'multipart/related; boundary='+b})}
const jsonBlob=s=>new Blob([s],{type:'application/json'});

/* ---------- guardar y traer ---------- */
function guardar(){PEND=true;guardarPend();pintarCopia();cola=cola.then(subirDatos).catch(()=>{});return cola}
/* respaldo en este aparato de lo que todavía no llegó al Drive (sin internet, Drive lleno, permiso vencido):
   si se cierra la ventana no se pierde; al volver a entrar se fusiona con lo del Drive y se sube */
const pendKey=()=>'mas-pend-'+EMAIL;
function guardarPend(){if(!db||!EMAIL)return;try{localStorage.setItem(pendKey(),JSON.stringify({base:BASE,mio:db,t:Date.now()}))}catch(e){}}
function borrarPend(){try{localStorage.removeItem(pendKey())}catch(e){}}
function leerPend(){try{return JSON.parse(localStorage.getItem(pendKey())||'null')}catch(e){return null}}
async function leerRemoto(){const r=await g('GET',DAPI+'/files/'+ARCH+'?alt=media');const t=await r.text();let d=null;try{d=JSON.parse(t)}catch(e){}return d}
async function subirDatos(){
  if(!PEND||!db||!CARP)return;
  for(let i=0;i<6;i++){
    const envio=JSON.stringify(db);PEND=false;GUARDANDO=true;
    try{
      if(ARCH){const m=await g('GET',DAPI+'/files/'+ARCH+'?fields=version');
        if(String(m.version)!==String(VERS)){   // otro aparato guardó: se fusiona y se reintenta
          const suyo=(await leerRemoto())||VACIO(),mio=JSON.parse(envio);
          db=fusionar(mio,db,fusionar(JSON.parse(BASE),mio,suyo));normalizar();BASE=JSON.stringify(suyo);VERS=m.version;PEND=true;GUARDANDO=false;continue}}
      const r=await subirDrive(ARCH?{}:{name:'datos.json',parents:[CARP]},jsonBlob(envio),ARCH);
      ARCH=r.id;VERS=r.version;ULT=r.modifiedTime;BASE=envio;ERRG=null;GUARDANDO=false;
      guardarHistorial(envio);
      if(JSON.stringify(db)===envio){borrarPend();LLENO_VISTO=false;pintarCopia();return}
      PEND=true;
    }catch(e){GUARDANDO=false;PEND=true;
      if(e.message==='reconectar'){ERRG='reconectar';pintarCopia();avisoReconectar();return}
      if(e.message==='drive-lleno'){ERRG='lleno';pintarCopia();avisoLleno();return}
      if(esRed(e)){ERRG='sin-red';pintarCopia();return}
      const ya=ERRG==='error';ERRG='error';pintarCopia();if(!ya)toast('No se pudo guardar: '+msj(e));return}
  }

function urlAdjNube(a){if(!a.driveId)return '';if(URLS[a.driveId])return URLS[a.driveId];
  if(!pidiendo.has(a.driveId)){pidiendo.add(a.driveId);
    g('GET',DAPI+'/files/'+a.driveId+'?alt=media').then(r=>r.blob()).then(b=>{URLS[a.driveId]=URL.createObjectURL(b);if(vista==='ficha'&&tabF==='archivos')repintar()}).catch(()=>{}).finally(()=>pidiendo.delete(a.driveId))}
  return ''}
const nombreLimpio=n=>(n||'archivo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').replace(/_+/g,'_').slice(-80)||'archivo';
async function achicar(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<700*1024)return f;
  try{const bmp=await createImageBitmap(f),k=Math.min(1,2000/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(e){return f}}
async function subir(pid,files){files=[...files];if(!files.length)return;const carp=carpSubir();
  toast('Guardando '+files.length+' archivo'+(files.length>1?'s':'')+' en tu Drive…');let ok=0;
  try{if(!ADJ)ADJ=await carpeta('adjuntos',CARP)}catch(e){toast(msj(e));if(e.message==='reconectar')avisoReconectar();return}
  for(const f0 of files){
    if(f0.size>40*1024*1024){toast(f0.name+' es demasiado grande (máximo 40 MB).');continue}
    const f=await achicar(f0),ts=new Date(),archivo=ts.getFullYear()+pad(ts.getMonth()+1)+pad(ts.getDate())+'-'+pad(ts.getHours())+pad(ts.getMinutes())+pad(ts.getSeconds())+'-'+nombreLimpio(f.name);
    try{const r=await subirDrive({name:'p'+pid+'-'+archivo,parents:[ADJ]},f,null,'id');
      db.A.push({id:uid(),pid,archivo,driveId:r.id,nombre:f0.name,tipo:f.type,fecha:iso(hoy),subido:new Date().toISOString(),...(carp?{carpeta:carp}:{})});ok++}
    catch(e){if(e.message==='drive-lleno'){LLENO_VISTO=false;avisoLleno();break}
      toast('No se pudo guardar '+f0.name+': '+msj(e));if(e.message==='reconectar'){avisoReconectar();break}}}
  if(ok){guardar();toast(ok===1?'Archivo guardado.':ok+' archivos guardados.')}
  tabF='archivos';ir('ficha',pid)}

  db.cfg.perfil=Object.assign({},db.cfg.perfil,{nombre:n,especialidad:$id('c_esp').value.trim(),slogan:$id('c_slo').value.trim()});
  guardar();perfilDesdeDb();toast('Guardado.')}

function descargarCopia(){const b=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='MAS Consultorios - copia '+iso(new Date())+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Copia descargada (sin las fotos ni los PDF).')}
async function verDias(){let L;
  try{if(!HIST)HIST=await carpeta('historial',CARP);L=await buscarArch(`'${HIST}' in parents`,'id,name')}catch(e){toast(msj(e));return}
  L=L.filter(f=>/^datos-\d{4}-\d\d-\d\d\.json$/.test(f.name)).sort((a,b)=>b.name.localeCompare(a.name));
  if(!L.length){toast('Todavía no hay copias de días anteriores.');return}
  abrir(`<div class="mh"><h2>Volver a un día anterior</h2></div><div class="mb">
    <p>Se trae todo como estaba al final del día que elijas. Lo de ahora queda guardado en la copia de hoy, por si te arrepentís.</p>
    <div class="mfield"><label>Día</label><select id="d_dia">${L.map(f=>{const d=f.name.slice(6,16);return `<option value="${f.id}">${may(fLarga(parse(d)))} (${fCorta(d)})</option>`}).join('')}</select></div></div>
    <div class="mf"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn danger" onclick="volverDia()">Volver a ese día</button></div>`)}
async function volverDia(){const id=$id('d_dia').value;cerrar();await cola;
  try{const d=await (await g('GET',DAPI+'/files/'+id+'?alt=media')).json();
    if(!d||!Array.isArray(d.P))throw new Error('La copia está dañada.');
    ultHist=0;await guardarHistorial(JSON.stringify(db));     // lo de ahora queda en la copia de hoy
    const m=await g('GET',DAPI+'/files/'+ARCH+'?fields=version');VERS=m.version;BASE=JSON.stringify(await leerRemoto()||VACIO());
    db=d;normalizar();guardar();await cola;perfilDesdeDb();toast('Listo: volviste a esa copia. '+db.P.length+' pacientes.');ir('inicio')}
  catch(e){toast(msj(e))}}
function importarLocal(file){if(!file)return;const rd=new FileReader();
  rd.onload=()=>{let d;try{d=JSON.parse(rd.result)}catch(e){toast('Ese archivo no es una copia de MAS Consultorios.');return}
    if(!d||!Array.isArray(d.P)){toast('Ese archivo no es una copia de MAS Consultorios.');return}
    const hacer=()=>{const perfil=db.cfg.perfil;d.cfg=Object.assign({},d.cfg||{},{perfil});(d.A||[]).forEach(a=>{if(!a.driveId)a.sinArchivo=true});
      db=d;normalizar();guardar();toast('Listo: '+db.P.length+' pacientes. Las fotos y PDF de la compu no se traen.');ir('inicio')};
    if(db.P.length)confirmar('Traer datos de la compu',`Ya tenés <b>${db.P.length} pacientes</b> acá. Se van a <b>reemplazar</b> por los ${d.P.length} del archivo (lo de ahora queda en la copia de hoy).`,'Reemplazar',hacer,true);
    else hacer()};
  rd.readAsText(file)}
function ofrecerRecuperar(){verDias()}

  try{await cola}catch(e){}
  if(PEND){toast('Todavía hay cambios sin guardar. Esperá a que se guarden.');return}
  try{if(GTOK)google.accounts.oauth2.revoke(GTOK,()=>{})}catch(e){}
  await cambiarCuenta();db=null;setTok(null)})}
