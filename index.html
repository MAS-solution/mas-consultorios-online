<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAS Consultorios</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E5F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAS Consultorios">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>

:root{
  --bg:#f0f4f4; --surface:#ffffff; --ink:#1e2a3a; --ink2:#3d4b5c; --muted:#6b7a8c; --faint:#9aa6b4;
  --line:#e2e9e9; --line2:#eef2f3;
  --blue:#2E5F63; --blue-h:#234a4d; --blue-soft:#e9f1f1;
  --teal:#079d9b; --teal-soft:#e3f5f4;
  --pink:#c2407e; --pink-soft:#fdecf6;
  --amber:#b8650f; --amber-soft:#fdf2e3;
  --r:14px; --shadow:0 1px 2px rgba(30,42,58,.04),0 6px 20px rgba(30,42,58,.05);
  --fh:"Outfit","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25;font-family:var(--fh);font-weight:600}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:square;stroke-linejoin:miter;flex-shrink:0}
svg.i.sm{width:15px;height:15px}

/* ---------- acceso ---------- */
#lock{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lock-art{background:linear-gradient(140deg,var(--blue) 0%,var(--blue-h) 100%);color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lock-art::after{content:"";position:absolute;right:-120px;bottom:-120px;width:380px;height:380px;border-radius:50%;border:56px solid rgba(255,255,255,.07)}
.lock-art .mark{display:flex;align-items:center;gap:12px;font-family:var(--fh);font-weight:500;font-size:16px}
.lock-art h2{font-size:34px;max-width:460px;letter-spacing:-.01em}
.lock-art p{color:rgba(255,255,255,.82);max-width:420px;margin:14px 0 0;font-size:16px}
.lock-art small{color:rgba(255,255,255,.65)}
.lock-form{display:grid;place-items:center;padding:24px;background:var(--surface)}
.lock-form form{width:100%;max-width:350px}
.lock-form h1{font-size:24px;margin-bottom:6px}
.lock-form .sub{color:var(--muted);margin:0 0 28px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.lock-art .logo{background:rgba(255,255,255,.16);color:#fff}

/* ---------- estructura ---------- */
#app{display:flex;min-height:100vh}
aside{width:248px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 26px}
.brand b{display:block;font-family:var(--fh);font-weight:600;font-size:15px;color:var(--blue)}
.brand small{display:block;font-size:12px;color:var(--muted)}
.navlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;padding:0 12px 8px}
.nav{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--ink2);font-weight:600;text-align:left;margin-bottom:3px}
.nav svg{color:var(--faint)}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--blue-soft);color:var(--blue)}
.nav.on svg{color:var(--blue)}
.nav .cnt{margin-left:auto;font-size:12px;background:var(--blue);color:#fff;border-radius:99px;padding:0 8px;line-height:20px}
.sidefoot{margin-top:auto}
.bk{display:flex;gap:10px;align-items:flex-start;font-size:13px;background:var(--teal-soft);color:var(--ink2);border-radius:12px;padding:12px;margin-bottom:14px}
.bk svg{color:var(--teal);margin-top:2px}
.bk b{display:block;color:var(--teal);font-weight:700}
:root[data-t=grafito]{--blue:#2f3a48;--blue-h:#1f2733;--blue-soft:#eef0f3;--bg:#f0f1f2;--line:#e2e3e5;--line2:#eeeff0}
:root[data-t=azul]{--blue:#2b4f7e;--blue-h:#203c61;--blue-soft:#eaf0f8;--bg:#f0f3f6;--line:#e1e6ed;--line2:#eef1f5}
:root[data-t=salvia]{--blue:#4a6b57;--blue-h:#3a5544;--blue-soft:#edf3ef;--bg:#f2f5f3;--line:#e6eae7;--line2:#f1f3f2}
:root[data-t=ciruela]{--blue:#6a3f66;--blue-h:#552f52;--blue-soft:#f5eef5;--bg:#f5f2f4;--line:#eae4ea;--line2:#f3f0f3}
:root[data-t=naranja]{--blue:#b65a28;--blue-h:#984a20;--blue-soft:#fbf0e9;--bg:#faf3f0;--line:#f5e8e1;--line2:#f9f2ee}
:root[data-t=ladrillo]{--blue:#9c4a2c;--blue-h:#803c23;--blue-soft:#f8eeea;--bg:#f8f2f0;--line:#f1e6e1;--line2:#f7f1ee}
:root[data-t=bordo]{--blue:#7a2e3a;--blue-h:#62242f;--blue-soft:#f6ecee;--bg:#f6f0f1;--line:#ece2e3;--line2:#f4eeef}
:root[data-t=rosa]{--blue:#9a5263;--blue-h:#7f4352;--blue-soft:#f7eef0;--bg:#f8f3f4;--line:#f1e7e9;--line2:#f7f1f3}
:root[data-t=mostaza]{--blue:#8a6a1c;--blue-h:#705615;--blue-soft:#f7f2e6;--bg:#f7f5ef;--line:#efeadf;--line2:#f6f3ed}
.temas{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 8px 14px}
.temas button{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.temas button.on{box-shadow:0 0 0 2px var(--ink)}
.me{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--line)}
.me b{display:block;font-size:14px}
.me small{font-size:12px;color:var(--muted)}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
header.bar{height:64px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(6px);display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:5}
.gsearch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px;width:360px;max-width:100%;color:var(--faint)}
.gsearch input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink)}
.bar .today{margin-left:auto;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
main{padding:8px 32px 48px;max-width:1200px;width:100%}

/* ---------- comunes ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:14px 0 24px}
.ph h1{font-size:24px;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted)}
.btn{height:40px;border-radius:10px;padding:0 16px;font-weight:700;border:1px solid var(--blue);background:var(--blue);color:#fff;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--blue-h);border-color:var(--blue-h)}
.btn.sec{background:var(--surface);color:var(--ink2);border-color:var(--line)}
.btn.sec:hover{background:var(--bg)}
.btn.teal{background:var(--teal);border-color:var(--teal)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.link{background:none;border:0;color:var(--blue);padding:0;height:auto;font-size:14px}
.btn.icon{width:32px;padding:0;justify-content:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.card-h h2{font-size:15px;display:flex;align-items:center;gap:10px}
.card-h .meta{color:var(--muted);font-size:13px}
.card-b{padding:4px 20px}
.chip{width:32px;height:32px;border-radius:3px;display:grid;place-items:center;flex-shrink:0}
.c-blue{background:var(--blue-soft);color:var(--blue)}.c-teal{background:var(--teal-soft);color:var(--teal)}
.c-pink{background:var(--pink-soft);color:var(--pink)}.c-amber{background:var(--amber-soft);color:var(--amber)}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{padding:18px 20px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;text-align:left;width:100%;transition:border-color .15s}
.kpi:hover{border-color:var(--blue)}
.fchip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 8px 0 14px;border-radius:4px;background:var(--blue-soft);color:var(--blue);font-weight:700;border:0}
.fchip span{font-size:18px;line-height:1;padding:0 6px}
.kpi .chip{width:44px;height:44px;border-radius:4px}
.kpi .chip svg{width:21px;height:21px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.kpi .n{font-family:var(--fh);font-size:26px;font-weight:600;line-height:1.2;margin-top:2px}
.kpi .d{font-size:12px;color:var(--faint)}
.cols{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700}
.row .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hora{font-family:var(--fh);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;width:54px;flex-shrink:0;color:var(--blue);background:var(--blue-soft);border-radius:8px;text-align:center;padding:4px 0}
.av{width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.av.pink{background:var(--pink-soft);color:var(--pink)}
.empty{color:var(--muted);font-size:14px;padding:16px 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.pill.pink{background:var(--pink-soft);color:var(--pink)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.teal{background:var(--teal-soft);color:var(--teal)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}

/* ---------- tablas ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.field-s{display:flex;align-items:center;gap:8px;flex:1;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px;color:var(--faint)}
.field-s input{border:0;outline:0;flex:1;min-width:0;background:none;color:var(--ink)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:12px 18px;background:#fafbfd;border-bottom:1px solid var(--line)}
td{padding:13px 18px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#f8fafd}
tbody tr:last-child td{border-bottom:0}
.pname{display:flex;align-items:center;gap:12px}
.pname b{font-weight:700;display:block}
.pname small{color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* ---------- ficha ---------- */
.back{display:inline-flex;align-items:center;gap:6px;margin:14px 0 14px}
.fhead{padding:22px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.fhead .av{width:60px;height:60px;font-size:19px;font-family:var(--fh)}
.fhead h1{font-size:22px}
.fhead .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:6px;border-top:1px solid var(--line2);padding:0 16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 10px;color:var(--muted);font-weight:700;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.side-data dl{margin:0;padding:4px 20px 18px}
.side-data dt{font-size:12px;color:var(--muted);margin-top:14px;font-weight:600}
.side-data dd{margin:2px 0 0;font-weight:700}
.compose{padding:18px 20px;border-bottom:1px solid var(--line2);background:#fafbfd;border-radius:var(--r) var(--r) 0 0}
.compose label{font-weight:700;font-size:14px;display:block;margin-bottom:8px}
.compose textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;resize:vertical;outline:0;background:#fff}
.compose textarea:focus,.mfield input:focus,.mfield select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.compose .fr{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.compose input{height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.compose .note{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:5px;margin-left:auto}
.evo{display:grid;grid-template-columns:96px 1fr;gap:18px;padding:18px 20px;border-top:1px solid var(--line2)}
.evo:first-child{border-top:0}
.evo .f{border-left:3px solid var(--teal);padding-left:10px}
.evo .f b{display:block;font-family:var(--fh);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.evo .f small{color:var(--muted);font-size:12px;text-transform:capitalize}
.evo p{margin:0;white-space:pre-wrap;color:var(--ink2)}
.file{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.file:first-child{border-top:0}
.file .s{color:var(--muted);font-size:12px}

/* ---------- agenda ---------- */
.day-h{font-family:var(--fh);font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center}
.day-h .pill{text-transform:none;font-family:"Nunito",sans-serif}

/* ---------- modal / aviso ---------- */
.modal{position:fixed;inset:0;background:rgba(30,42,58,.45);display:grid;place-items:center;padding:16px;z-index:20}
.mbox{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 24px 48px rgba(30,42,58,.2)}
.mbox .mh{padding:20px 24px;border-bottom:1px solid var(--line2)}
.mbox .mh h2{font-size:17px}
.mbox .mb{padding:20px 24px 6px}
.mfield{margin-bottom:14px}
.mfield label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.mfield input,.mfield select{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:0}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--line2);background:#fafbfd;border-radius:0 0 16px 16px}
#toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transform:translateY(10px);transition:.2s;z-index:30;max-width:calc(100% - 48px);pointer-events:none}
#toast.show{opacity:1;transform:none}
.demo{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(30,42,58,.72);color:#fff;font-size:12px;padding:4px 12px;border-radius:99px;z-index:4;pointer-events:none}

/* ---------- celular ---------- */
@media (max-width:900px){
  #lock{grid-template-columns:1fr}.lock-art{display:none}
  #app{flex-direction:column}
  aside{width:auto;height:auto;position:sticky;top:0;z-index:10;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;gap:2px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 2px}.brand div,.navlbl,.sidefoot,.nav .cnt{display:none}
  .nav{width:auto;margin:0;white-space:nowrap}
  header.bar{display:none}
  main{padding:4px 16px 60px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{flex-direction:column;gap:8px}
  .cols{grid-template-columns:1fr}
  .hide-m{display:none}
  .row{flex-wrap:wrap}.row .acts{width:100%;padding-left:102px}
  .evo{grid-template-columns:1fr;gap:6px}
  .frow{grid-template-columns:1fr}
}
@media print{
  aside,header.bar,.btn,.compose,.tabs,.noprint,.demo{display:none!important}
  body{background:#fff}main{padding:0}.card{border:0;box-shadow:none}
}


/* ---------- versión real ---------- */
.bk{cursor:pointer;border:0;text-align:left;width:100%;font:inherit}
.bk.warn{background:var(--amber-soft)}
.bk.warn svg,.bk.warn b{color:var(--amber)}
.bk.off{background:var(--bg)}
.bk.off svg,.bk.off b{color:var(--muted)}
.lock-form .err{color:var(--pink);font-size:13px;font-weight:700;min-height:20px;margin:-4px 0 8px}
.cfg{padding:6px 20px 20px}
.cfg p{margin:10px 0;color:var(--ink2)}
.cfg .path{font-family:Consolas,monospace;font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;word-break:break-all;color:var(--ink2)}
.cfg .acts{margin-top:14px}
.cfg ol{margin:8px 0;padding-left:20px;color:var(--ink2)}
.cfg ol li{margin:4px 0}
.estado{display:flex;gap:10px;align-items:center;font-weight:700;margin:14px 0 4px}
.estado.ok{color:var(--teal)}.estado.warn{color:var(--amber)}
.thumb{width:44px;height:44px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--bg);border:1px solid var(--line)}
.file .grow{min-width:0}.file b{word-break:break-all}
.wk{display:flex;gap:6px;align-items:center}
.cfg-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
.mb p{margin:0 0 12px;color:var(--ink2)}
.btn.danger{background:var(--pink);border-color:var(--pink)}
@media (max-width:900px){.cfg-grid{grid-template-columns:1fr}}

/* ---------- opcionales (12/11) ---------- */
.mbox.ancho{max-width:680px}
.opt{color:var(--faint);font-weight:600;font-size:12px}
details.mas{border:1px solid var(--line2);border-radius:10px;margin-bottom:12px;background:#fff}
details.mas summary{cursor:pointer;padding:11px 14px;font-weight:700;font-size:14px;color:var(--ink2);list-style:none;display:flex;justify-content:space-between;gap:10px}
details.mas summary::-webkit-details-marker{display:none}
details.mas summary::after{content:"+";color:var(--muted)}
details.mas[open] summary::after{content:"−"}
details.mas[open] summary{border-bottom:1px solid var(--line2)}
details.mas .in{padding:14px 14px 2px}
.mfield textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;outline:0;background:#fff;font:inherit}
.mfield textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:0 12px;height:36px;font-weight:700;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--blue-soft);color:var(--blue)}
.compose .parte{margin-bottom:8px}
.compose .parte small{display:block;font-weight:700;font-size:13px;color:var(--ink2);margin-bottom:4px}
.compose .parte textarea{min-height:56px}
.compose .extras{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.compose .extras select{height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.compose .modo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.compose .modo label{margin:0}
.evo .et{font-weight:700;color:var(--ink)}
.blq{padding:18px 20px;border-top:1px solid var(--line2)}
.blq:first-child{border-top:0}
.blq h3{font-size:15px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.blq .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.obj{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}
.obj:first-of-type{border-top:0}
.obj .grow{flex:1;min-width:0}
.obj button.pill{border:0;cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;outline:0;background:#fff}
.ev-t{font-weight:700}
.ev-serie{color:var(--muted);font-size:13px}
.chk{display:flex;gap:9px;align-items:flex-start;margin:9px 0;font-weight:600;color:var(--ink2);cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--blue)}
.chk small{display:block;font-weight:400;color:var(--muted)}
.aviso-aut{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;margin-top:6px}
#print{display:none}
@media print{
  body.imp #app,body.imp #modal,body.imp #toast,body.imp #lock{display:none!important}
  body.imp #print{display:block}
}
#print{font-family:"Nunito",sans-serif;color:#111;font-size:12.5px;line-height:1.5}
#print .ph1{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #222;padding-bottom:8px;margin-bottom:14px}
#print .ph1 b{font-size:15px}
#print h1{font-size:19px;margin:0 0 2px}
#print h2{font-size:14px;margin:18px 0 6px;border-bottom:1px solid #bbb;padding-bottom:3px}
#print table{width:100%;border-collapse:collapse}
#print td{padding:3px 8px 3px 0;vertical-align:top}
#print td.k{color:#555;width:190px}
#print .ses{padding:6px 0;border-bottom:1px solid #ddd;page-break-inside:avoid}
#print .ses b{display:inline-block;min-width:90px}
#print p{margin:4px 0;white-space:pre-wrap}
#print .firma{margin-top:60px;text-align:right}
#print .firma div{display:inline-block;border-top:1px solid #222;padding-top:4px;min-width:240px;text-align:center}

/* ---------- marca MAS Consultorios ---------- */
.marca-neg svg{width:280px;height:auto;display:block;margin:-30px 0 0 -26px}
.marca-circ{width:42px;height:42px;flex-shrink:0}
.marca-circ svg{width:100%;height:100%;display:block}
.brand b{letter-spacing:.01em}

/* agenda: calendario mensual */
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cal{padding:10px}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-h span{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding:4px 0}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-d{position:relative;min-height:92px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;color:var(--ink)}
.cal-d:hover{border-color:var(--blue)}
.cal-d.fuera{opacity:.4}
.cal-d.hoy{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cal-d.hoy .cal-n{background:var(--blue);color:#fff;border-radius:99px;padding:0 7px}
.cal-n{font-size:13px;font-weight:600;align-self:flex-start}
.cal-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-i{font-size:11.5px;line-height:1.25;background:var(--blue-soft);color:var(--blue);border-radius:5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-i.fijo{background:var(--teal-soft);color:var(--teal)}
.cal-mas{font-size:11px;color:var(--muted);padding-left:2px}
.cal-c{display:none}
@media (max-width:900px){
  .cal{padding:6px}.cal-g,.cal-h{gap:2px}
  .cal-d{min-height:54px;padding:4px;align-items:center}
  .cal-t{display:none}
  .cal-c{display:block;font-size:11px;font-weight:700;background:var(--blue);color:#fff;border-radius:99px;min-width:18px;text-align:center;padding:0 5px}
  .cal-n{align-self:center}
}

.licfranja{display:flex;align-items:center;gap:8px;background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:6px 6px 6px 12px;margin:0 0 12px;font-size:13px}
.licfranja span{flex:1}.licfranja.urg{background:#fbe7e6;color:#b42318}
.licx{flex:none;border:0;background:transparent;color:inherit;cursor:pointer;padding:4px;border-radius:6px;display:grid;place-items:center;opacity:.7}
.licx:hover{opacity:1;background:rgba(0,0,0,.06)}

.colores{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:6px}
.colores button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px;text-align:left}
.colores button i{width:22px;height:22px;border-radius:50%;flex:none}
.colores button.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);font-weight:700}

/* archivos: carpetas */
.carps{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0 6px}
.carps button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.carps button .n{font-size:11px;color:var(--muted)}
.carps button.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.carps button.on .n{color:var(--blue)}
.carps .mas{border-style:dashed;color:var(--muted)}
.carp-h{display:flex;align-items:center;gap:7px;margin-top:14px;padding:6px 0;font-family:var(--fh);font-weight:600;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line)}
.carp-h span{color:var(--muted);font-weight:400}
.carp-h + .file{border-top:0}
.file .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.subir{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0 16px;border-top:1px solid var(--line2);margin-top:8px}
.subir .lbl{font-size:13px;color:var(--muted);font-weight:700}
.subir select{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface);max-width:220px}
.cp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cp-row input{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px}
.cp-row .s{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:600px){.file{flex-wrap:wrap}.file .acts{width:100%;justify-content:flex-start}}

/* aviso de versión nueva */
.nov-h{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.nov{list-style:none;margin:0;padding:0}
.nov li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2);font-size:14px}
.nov li:first-child{border-top:0}
.nov .chip{width:32px;height:32px;flex-shrink:0}
.nov-t{font-size:15px;margin:14px 0 4px}

/* equipo terapéutico (ficha, debajo de los datos del paciente) */
.eq-b{border-top:1px solid var(--line);padding:14px 20px 16px}
.eq-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.eq-h h3{margin:0;font-size:15px;display:flex;align-items:center;gap:10px}
.eq-it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.eq-it:first-of-type{border-top:0}
.eq-it .grow{flex:1;min-width:0}
.eq-it small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.eq-it b{display:block}
.eq-it .eq-cel{font-size:13px;color:var(--ink2)}
.eq-it .acts{display:flex;gap:6px;flex-shrink:0}
.bk.bad{background:var(--pink-soft)}
.bk.bad svg,.bk.bad b{color:var(--pink)}
.estado.bad{color:var(--pink)}

.reco{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px 12px;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);font-size:14px}
.reco[hidden]{display:none}.reco span{display:flex;gap:6px;align-items:center}
</style>
</head>

  e.textContent='Verificando…';
  try{const L=await api('POST','/api/licencia',{codigo:c});trasLicencia(L)}catch(x){e.textContent=x.message}}
async function probarLicencia(){const e=document.getElementById('lerr');if(e)e.textContent='Verificando…';
  try{const L=await api('POST','/api/licencia',{});trasLicencia(L)}catch(x){if(e)e.textContent=x.message}}
async function trasLicencia(L){
  if(!licOk(L)){mostrarLicencia(L);if(L.estado!=='sin-codigo'&&L.estado!=='verificando'){const e=document.getElementById('lerr');if(e&&!e.textContent)e.textContent=''}return}
  LIC_PANTALLA=false;EST=await api('GET','/api/estado');toast('Licencia activa'+(L.vence?' hasta el '+fCorta(L.vence):'')+'.');
  if(EST.configurada&&TOKEN){try{await abrirApp();return}catch(e){setTok(null)}}
  mostrarLock()}
/* aviso de renovación: discreto, desde 7 días antes; se puede cerrar y vuelve a aparecer a las 12 horas */
const LIC_AVISO_DIAS=7,LIC_AVISO_VUELVE=12*3600e3;let licOcultoMem=0;
function diasAbono(L){if(!L||!L.vence||!licOk(L))return null;const h=new Date();h.setHours(0,0,0,0);return Math.round((parse(L.vence)-h)/864e5)}
function textoAbono(d,v){return d<=0?'Tu abono vence <b>hoy</b>':d===1?'Tu abono vence <b>mañana</b>':`Tu abono vence el <b>${fCorta(v)}</b> (en ${d} días)`}
function licOculto(){let t=licOcultoMem;try{t=Math.max(t,+localStorage.getItem('licOculto')||0)}catch(e){}return Date.now()-t<LIC_AVISO_VUELVE}
function cerrarAbono(){licOcultoMem=Date.now();try{localStorage.setItem('licOculto',String(licOcultoMem))}catch(e){}const f=document.getElementById('licfranja');if(f)f.remove()}
function franjaAbono(L){let f=document.getElementById('licfranja');const d=diasAbono(L);
  if(d===null||d>LIC_AVISO_DIAS||licOculto()){if(f)f.remove();return}
  if(!f){f=document.createElement('div');f.id='licfranja';const v=document.getElementById('view');v.parentNode.insertBefore(f,v)}
  f.className='licfranja'+(d<=2?' urg':'');
  f.innerHTML=`${ic('warn','sm')}<span>${textoAbono(d,L.vence)}. Comunicate para renovarlo.</span><button class="licx" title="Cerrar (vuelve a aparecer en 12 horas)" onclick="cerrarAbono()">${ic('x','sm')}</button>`}
function avisoVencimiento(){franjaAbono(EST_LIC())}
setInterval(()=>{if(TOKEN)franjaAbono(EST_LIC())},60000);
function EST_LIC(){return typeof LIC!=='undefined'&&LIC?LIC:(EST&&EST.licencia)}

async function crear(){const v=id=>document.getElementById(id).value,e=document.getElementById('lerr');
  if(!v('s_nom').trim()){e.textContent='Escribí tu nombre.';return}

  try{const j=await api('POST','/api/crear',{nombre:v('s_nom').trim(),especialidad:v('s_esp').trim(),pass:v('s_p1')});setTok(j.token);await abrirApp()}catch(x){e.textContent=x.message}}
async function entrar(){const e=document.getElementById('lerr'),p=document.getElementById('pass');

function cuando(isoTs){if(!isoTs)return '';const d=new Date(isoTs);const h=pad(d.getHours())+':'+pad(d.getMinutes());
  const dd=new Date(d);dd.setHours(0,0,0,0);const dif=Math.round((hoy-dd)/864e5);
  return (dif===0?'hoy':dif===1?'ayer':fCorta(iso(dd)))+' a las '+h}
function estadoCopia(){
  if(EST.sinDrive)return{k:'warn',t:'Falta conectar Google Drive',s:'Las fichas están guardadas solo en esta compu.'};
  if(EST.error)return{k:'warn',t:'No se pudo copiar a Google Drive',s:EST.error};
  if(EST.ultimaCopia)return{k:'ok',t:'Copia de seguridad al día',s:'Guardada en Google Drive '+cuando(EST.ultimaCopia)+'.'};
  return{k:'off',t:'Copia de seguridad',s:'Todavía no se hizo ninguna.'};
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3200)}
function waNum(tel){let d=String(tel||'').replace(/\D/g,'');
  if(d.startsWith('54'))d=d.slice(2);if(d.startsWith('9')&&d.length===11)d=d.slice(1);if(d.startsWith('0'))d=d.slice(1);
  if(d.length===12){for(const k of [2,3,4]){if(d.substr(k,2)==='15'){d=d.slice(0,k)+d.slice(k+2);break}}}
  return d.length===10?'549'+d:''}

/* ---------- turnos fijos ----------
   db.S = [{id,pid,desde,hora,cada(semanas),hasta|null,saltear:[fechas canceladas]}]
   Se generan los turnos reales (db.T con serie) hasta 12 semanas adelante. */
const fijosDe=pid=>db.S.filter(x=>x.pid==pid&&(!x.hasta||x.hasta>=iso(hoy)));
const textoFijo=x=>(x.cada==2?'cada 2 semanas, los ':'todos los ')+(DIAS[parse(x.desde).getDay()]+'s').replace(/ss$/,'s')+' a las '+x.hora;
let _fijosDia='';
function extenderFijos(forzar){if(!db||!db.S||(!forzar&&_fijosDia===iso(hoy)))return false;_fijosDia=iso(hoy);
  let cambio=false;const tope=iso(addDays(84)),hoyS=iso(hoy);
  for(const x of db.S){if(!pac(x.pid))continue;const d=parse(x.desde);
    while(iso(d)<=tope&&(!x.hasta||iso(d)<=x.hasta)){const f=iso(d);
      if(f>=hoyS&&!(x.saltear||[]).includes(f)&&!db.T.some(t=>t.serie===x.id&&t.fecha===f)){db.T.push({id:uid(),pid:x.pid,fecha:f,hora:x.hora,serie:x.id});cambio=true}
      d.setDate(d.getDate()+7*(x.cada||1))}}
  return cambio}
function cancelarFijo(tid,siguientes){const t=db.T.find(x=>x.id===tid),x=db.S.find(s=>s.id===t.serie),p=pac(t.pid);cerrar();
  if(siguientes){const ant=parse(t.fecha);ant.setDate(ant.getDate()-1);x.hasta=iso(ant);db.T=db.T.filter(y=>!(y.serie===x.id&&y.fecha>=t.fecha));
    if(x.hasta<x.desde)db.S=db.S.filter(s=>s.id!==x.id);toast('Turno fijo cancelado desde el '+fCorta(t.fecha)+'.')}
  else{x.saltear=(x.saltear||[]).concat(t.fecha);db.T=db.T.filter(y=>y.id!==tid);toast('Turno del '+fCorta(t.fecha)+' cancelado. El turno fijo sigue.')}
  guardar();ir(vista,vista==='ficha'?p.id:undefined)}
/* cambiar un solo turno (si es de un turno fijo, ese día queda como excepción) */
function moverTurno(tid){const t=db.T.find(x=>x.id===tid),p=pac(t.pid);
  abrir(`<div class="mh"><h2>Cambiar turno</h2></div><div class="mb">
  <p><b>${esc(nom(p))}</b> · ${may(fLarga(parse(t.fecha)))} a las ${t.hora}${t.serie?'<br><span style="color:var(--muted);font-size:13px">Es un turno fijo: se cambia <b>solo este día</b>. Para cambiarlo siempre, usá "Editar" en la ficha, pestaña Turnos.</span>':''}</p>
  <div class="frow"><div class="mfield"><label>Nuevo día</label><input type="date" id="m_f" value="${t.fecha}"></div><div class="mfield"><label>Nueva hora</label><input type="time" id="m_h" value="${t.hora}"></div></div></div>
  <div class="mf"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="guardarMover('${tid}')">Guardar</button></div>`)}
function guardarMover(tid){const t=db.T.find(x=>x.id===tid),f=document.getElementById('m_f').value,h=document.getElementById('m_h').value;
  if(!f||!h){toast('Elegí día y hora.');return}
  if(f===t.fecha&&h===t.hora){cerrar();return}
  const x=t.serie&&db.S.find(s=>s.id===t.serie);
  if(x&&!(x.saltear||[]).includes(t.fecha))x.saltear=(x.saltear||[]).concat(t.fecha);
  const choca=db.T.find(y=>y.id!==tid&&y.fecha===f&&y.hora===h);
  t.fecha=f;t.hora=h;if(x)t.movido=true;guardar();cerrar();
  toast('Turno cambiado al '+fLarga(parse(f))+' a las '+h+'.'+(choca?' Ojo: a esa hora ya tenías a '+nom(pac(choca.pid))+'.':''));
  ir(vista,vista==='ficha'?t.pid:undefined)}
/* editar el turno fijo desde una fecha en adelante (lo anterior no se toca) */
function proxFijo(x){const d=parse(x.desde);while(iso(d)<iso(hoy))d.setDate(d.getDate()+7*(x.cada||1));return iso(d)}
function editarFijo(sid){const x=db.S.find(s=>s.id===sid),p=pac(x.pid);
  abrir(`<div class="mh"><h2>Editar turno fijo</h2></div><div class="mb">
  <p><b>${esc(nom(p))}</b> · hoy: ${textoFijo(x)}</p>
  <div class="mfield"><label>A partir del <span class="opt">el día de la semana sale de esta fecha</span></label><input type="date" id="ef_f" value="${proxFijo(x)}"></div>
  <div class="frow"><div class="mfield"><label>Hora</label><input type="time" id="ef_h" value="${x.hora}"></div>
  <div class="mfield"><label>Cada cuánto</label><select id="ef_c"><option value="1" ${x.cada!=2?'selected':''}>Todas las semanas</option><option value="2" ${x.cada==2?'selected':''}>Cada 2 semanas</option></select></div></div>
  <div class="mfield"><label>Hasta <span class="opt">opcional</span></label><input type="date" id="ef_hasta" value="${x.hasta||''}"></div>
  <p style="color:var(--muted);font-size:13px">Los turnos anteriores a esa fecha quedan como estaban.</p></div>
  <div class="mf"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="guardarFijo('${sid}')">Guardar</button></div>`)}
function guardarFijo(sid){const x=db.S.find(s=>s.id===sid),g=k=>document.getElementById(k).value;
  const f=g('ef_f'),h=g('ef_h'),cada=+g('ef_c')||1,hasta=g('ef_hasta')||null;
  if(!f||!h){toast('Elegí la fecha y la hora.');return}
  if(f<iso(hoy)){toast('La fecha tiene que ser de hoy en adelante.');return}
  if(hasta&&hasta<f){toast('La fecha "hasta" es anterior al primer turno.');return}
  // corta el viejo el día anterior y borra sus turnos desde esa fecha (salvo los que se movieron a mano)
  const ant=parse(f);ant.setDate(ant.getDate()-1);x.hasta=iso(ant);
  db.T=db.T.filter(y=>!(y.serie===sid&&y.fecha>=f&&!y.movido));
  if(x.hasta<x.desde)db.S=db.S.filter(s=>s.id!==sid);
  const nid=uid();db.S.push({id:nid,pid:x.pid,desde:f,hora:h,cada,hasta,saltear:[]});
  extenderFijos(true);guardar();cerrar();
  toast('Turno fijo cambiado: '+textoFijo(db.S[db.S.length-1])+', desde el '+fCorta(f)+'.');tabF='turnos';ir('ficha',x.pid)}
function quitarFijo(sid){const x=db.S.find(s=>s.id===sid),p=pac(x.pid);
  confirmar('Quitar turno fijo','¿Quitar el turno fijo de <b>'+esc(nom(p))+'</b> ('+textoFijo(x)+')? Se borran los turnos que vienen desde hoy.','Quitar',()=>{
    const ay=iso(addDays(-1));x.hasta=ay;db.T=db.T.filter(y=>!(y.serie===sid&&y.fecha>=iso(hoy)));
    if(x.hasta<x.desde)db.S=db.S.filter(s=>s.id!==sid);guardar();toast('Turno fijo quitado.');ir('ficha',p.id)},true)}

  if(tabF==='anam'){const a=p.anam||{};

      <div class="frow"><div class="mfield"><label>Fecha de la entrevista</label><input type="date" id="an_fecha" value="${esc(a.fecha||'')}"></div><div class="mfield"><label>Quién dio los datos</label><input id="an_quien" value="${esc(a.quien||'')}" placeholder="Ej.: la mamá"></div></div>
      ${anamCampos(a).map(([k,l])=>`<div class="mfield"><label>${l}</label><textarea id="an_${k}">${esc(a[k]||'')}</textarea></div>`).join('')}
      <button class="btn" onclick="guardarAnam(${p.id})">Guardar primera consulta</button>${a.editado?`<span class="note" style="margin-left:10px;color:var(--faint);font-size:12px">Guardada ${esc(cuando(a.editado))}</span>`:''}</div>`}
  if(tabF==='evalu'){
    const grupos={};V.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(v=>(grupos[v.test]=grupos[v.test]||[]).push(v));
    cuerpo=`<div class="blq"><h3>Objetivos del tratamiento</h3><p class="sub">Tocá el estado para pasarlo de "En proceso" a "Logrado".</p>
      ${Ob.length?Ob.map(o=>`<div class="obj"><div class="grow"><b>${esc(o.texto)}</b><div class="ev-serie">Desde ${fCorta(o.desde)}${o.logrado?' · logrado el '+fCorta(o.logrado):''}</div></div>
        <button class="pill ${o.logrado?'teal':'amber'}" onclick="togObj('${o.id}')">${o.logrado?'Logrado':'En proceso'}</button>
        <button class="btn sm sec icon noprint" title="Borrar objetivo" onclick="borrarObj('${o.id}')">${ic('x','sm')}</button></div>`).join(''):'<div class="empty" style="padding:6px 0">Todavía no cargaste objetivos.</div>'}
      <div class="addrow noprint"><input id="ob_t" placeholder="Escribí un objetivo nuevo" onkeydown="if(event.key==='Enter')nuevoObj(${p.id})"><button class="btn sec" onclick="nuevoObj(${p.id})">${ic('plus','sm')}Agregar</button></div></div>
    <div class="blq"><h3>Evaluaciones y tests<button class="btn sm sec noprint" onclick="nuevaEval(${p.id})">${ic('plus','sm')}Cargar evaluación</button></h3><p class="sub">Si cargás el mismo test más de una vez, se ve cómo fue cambiando el puntaje.</p>
      ${Object.keys(grupos).length?Object.entries(grupos).map(([t,L])=>`<div class="obj" style="display:block">
        <div class="ev-t">${esc(t)}</div><div class="ev-serie">${L.filter(v=>v.puntaje).map(v=>esc(v.puntaje)).join(' → ')||'Sin puntaje'}</div>
        ${L.slice().reverse().map(v=>`<div style="display:flex;gap:10px;align-items:flex-start;margin-top:8px"><div class="grow" style="flex:1;font-size:14px"><b>${fCorta(v.fecha)}</b>${v.puntaje?' · Puntaje: '+esc(v.puntaje):''}${v.obs?`<div style="color:var(--ink2);white-space:pre-wrap">${esc(v.obs)}</div>`:''}</div>
          <button class="btn sm sec icon noprint" title="Borrar" onclick="borrarEval('${v.id}')">${ic('x','sm')}</button></div>`).join('')}</div>`).join(''):'<div class="empty" style="padding:6px 0">Todavía no cargaste evaluaciones.</div>'}</div>`}
  if(tabF==='turnos')cuerpo=`<div class="card-b">${fijosDe(p.id).map(x=>`<div class="row"><div class="hora">${x.hora}</div><div class="grow"><div class="t">Turno fijo: ${textoFijo(x)}</div><div class="s">Desde el ${fCorta(x.desde)}${x.hasta?' hasta el '+fCorta(x.hasta):''}</div></div>
      <div class="acts"><button class="btn sm sec" onclick="editarFijo('${x.id}')">Editar</button><button class="btn sm sec" onclick="quitarFijo('${x.id}')">Quitar turno fijo</button></div></div>`).join('')}${T.length?T.map(t=>`<div class="row"><div class="hora">${t.hora}</div><div class="grow"><div class="t">${may(fLarga(parse(t.fecha)))}${t.serie?' <span class="pill teal">Fijo</span>':''}</div><div class="s">${esc(p.modal)}</div></div>
      <div class="acts"><button class="btn sm sec" onclick="recordar('${t.id}')">${ic('msg','sm')}Recordar</button><button class="btn sm sec" onclick="moverTurno('${t.id}')">Cambiar</button><button class="btn sm sec icon" title="Cancelar turno" onclick="cancelarTurno('${t.id}')">${ic('x','sm')}</button></div></div>`).join(''):'<div class="empty">No tiene turnos próximos.</div>'}
      <div style="padding:10px 0 16px"><button class="btn sm" onclick="nuevoTurno(${p.id})">${ic('plus','sm')}Dar turno</button></div></div>`;
  if(tabF==='archivos')cuerpo=tabArchivos(p,A);
  const au=autUso(p),av=autAviso(p);
  const dd=(t,v)=>v?`<dt>${t}</dt><dd>${esc(v)}</dd>`:'';
  return `<button class="btn link back noprint" onclick="ir('pacientes')">${ic('left','sm')}Volver a pacientes</button>
  <div class="card" style="margin-bottom:18px"><div class="fhead"><div class="av ${dc<=7?'pink':''}">${ini(p)}</div>
    <div style="flex:1;min-width:200px"><h1>${esc(nom(p))}</h1>
      <div class="tags"><span class="pill blue">${edad(p.nac)} años</span>${activo(p)?'':`<span class="pill">Dado de alta${p.fechaAlta?' el '+fCorta(p.fechaAlta):''}</span>`}${p.obra?`<span class="pill">${esc(p.obra)}</span>`:''}${p.modal?`<span class="pill teal">${esc(p.modal)}</span>`:''}${dc===0?`<span class="pill pink">${ic('cake','sm')}Cumple hoy</span>`:dc<=7?`<span class="pill pink">${ic('cake','sm')}Cumple en ${dc} días</span>`:''}</div></div>
    <div class="acts noprint"><button class="btn sec" onclick="formInforme(${p.id})">${ic('file','sm')}Informe</button><button class="btn sec" onclick="imprimirHistoria(${p.id})">${ic('print','sm')}Imprimir historia</button><button class="btn" onclick="nuevoTurno(${p.id})">${ic('plus','sm')}Dar turno</button></div></div>
    <div class="tabs">${tab('historia','Historia clínica ('+E.length+')')}${O.anam?tab('anam','Primera consulta'):''}${O.evalu?tab('evalu','Objetivos y evaluaciones'+(Ob.length+V.length?' ('+(Ob.length+V.length)+')':'')):''}${tab('turnos','Turnos ('+T.length+')')}${tab('archivos','Archivos ('+A.length+')')}</div></div>
  <div class="grid cols" style="align-items:start">
    <div class="card">${cuerpo}</div>
    <div class="card side-data"><div class="card-h"><h2><span class="chip c-blue">${ic('user','sm')}</span>Datos del paciente</h2><button class="btn link noprint" onclick="editarPaciente(${p.id})">Editar</button></div>
      <dl><dt>Motivo de consulta</dt><dd>${esc(p.motivo)||'—'}</dd>
      ${dd('Diagnóstico médico',p.diag)}${dd('Derivado por',p.deriva)}
      <dt>Fecha de nacimiento</dt><dd>${fCorta(p.nac)}</dd>
      <dt>DNI</dt><dd>${esc(p.dni)||'—'}</dd>
      <dt>Teléfono</dt><dd>${esc(p.tel)||'—'}</dd>
      <dt>Obra social · N° de afiliado</dt><dd>${esc(p.obra)}${p.afil?' · '+esc(p.afil):''}</dd>
      ${au?`<dt>Autorización${p.autNum?' N° '+esc(p.autNum):''}</dt><dd>${au.tot?au.us+' de '+au.tot+' sesiones usadas':au.us+' sesiones'}${p.autHasta?' · hasta el '+fCorta(p.autHasta):''}${av?`<div class="aviso-aut">${may(av)}</div>`:''}</dd>`:''}
      ${dd('Responsable',p.tutor)}${dd('Teléfono del responsable',p.telResp)}
      ${p.escuela||p.grado?`<dt>Escuela</dt><dd>${esc([p.escuela,p.grado].filter(Boolean).join(' · '))}</dd>`:''}${dd('Maestra integradora',p.integradora)}
      ${!activo(p)&&p.motivoAlta?dd('Motivo del alta',p.motivoAlta):''}</dl>
      <div style="padding:0 20px 18px" class="noprint">${activo(p)?`<button class="btn sm sec" onclick="darAlta(${p.id})">Dar de alta</button>`:`<button class="btn sm sec" onclick="reactivar(${p.id})">Volver a tratamiento</button>`} <button class="btn sm sec" onclick="eliminarPaciente(${p.id})">Eliminar paciente</button></div>
      ${cardEquipo(p)}</div>
  </div>`}

/* ---------- EQUIPO TERAPÉUTICO: otros profesionales que atienden al paciente (p.eq = [{id,esp,nom,cel}]) ---------- */
const ESP_EQ=['Fonoaudiología','Psicología','Psicopedagogía','Terapia ocupacional','Kinesiología','Psicomotricidad','Estimulación temprana','Musicoterapia','Acompañante terapéutico','Maestra integradora','Neurología','Psiquiatría','Pediatría','Otorrinolaringología','Nutrición','Médico de cabecera'];
const equipo=p=>Array.isArray(p.eq)?p.eq:[];
/* profesionales ya cargados en cualquier paciente, para no escribirlos de nuevo */
function profConocidos(){const m={};db.P.forEach(p=>equipo(p).forEach(x=>{if(x.nom)m[x.nom.toLowerCase()]=x}));return Object.values(m).sort((a,b)=>a.nom.localeCompare(b.nom))}
function cardEquipo(p){const L=equipo(p);
  return `<div class="eq-b"><div class="eq-h"><h3><span class="chip c-teal">${ic('users','sm')}</span>Equipo terapéutico</h3><button class="btn link noprint" onclick="formEquipo(${p.id})">${ic('plus','sm')}Agregar</button></div>
    ${L.length?L.map(x=>`<div class="eq-it"><div class="grow"><small>${esc(x.esp)||'Profesional'}</small><b>${esc(x.nom)}</b>${x.cel?`<span class="eq-cel">${esc(x.cel)}</span>`:''}</div>
      <div class="acts noprint">${x.cel?`<button class="btn sm sec icon" title="Escribirle por WhatsApp" onclick="wa('',${JSON.stringify(x.cel).replace(/"/g,'&quot;')})">${ic('msg','sm')}</button>`:''}<button class="btn sm sec" onclick="formEquipo(${p.id},'${x.id}')">Editar</button></div></div>`).join('')
      :'<div class="empty" style="padding:4px 0 2px">Psicopedagoga, terapista, neurólogo… quienes atienden también a este paciente.</div>'}</div>`}
function formEquipo(pid,xid){const x=equipo(pac(pid)).find(e=>e.id===xid)||{};const C=profConocidos();
  abrir(`<div class="mh"><h2>${xid?'Editar profesional':'Agregar al equipo terapéutico'}</h2></div><div class="mb">
  <div class="mfield"><label>Nombre</label><input id="eq_n" list="dl_eqn" value="${esc(x.nom||'')}" placeholder="Ej.: Lic. María Pérez" oninput="autoEquipo()">
    <datalist id="dl_eqn">${C.map(c=>`<option value="${esc(c.nom)}">${esc(c.esp||'')}</option>`).join('')}</datalist></div>
  <div class="frow"><div class="mfield"><label>Especialidad</label><input id="eq_e" list="dl_eqe" value="${esc(x.esp||'')}" placeholder="Ej.: Psicopedagogía"><datalist id="dl_eqe">${ESP_EQ.map(e=>`<option value="${e}">`).join('')}</datalist></div>
    <div class="mfield"><label>Celular <span class="opt">opcional</span></label><input id="eq_c" value="${esc(x.cel||'')}" placeholder="Ej.: 3521 555555" inputmode="tel"></div></div></div>
  <div class="mf">${xid?`<button class="btn sec" style="margin-right:auto;color:var(--pink)" onclick="quitarEquipo(${pid},'${xid}')">Quitar</button>`:''}<button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="guardarEquipo(${pid},'${xid||''}')">Guardar</button></div>`)}
/* si elige un profesional que ya cargó en otro paciente, completa especialidad y celular */
function autoEquipo(){const i=document.getElementById('eq_n'),n=i.value.trim().toLowerCase(),c=profConocidos().find(x=>x.nom.toLowerCase()===n);if(!c)return;i.value=c.nom;
  const e=document.getElementById('eq_e'),t=document.getElementById('eq_c');if(!e.value)e.value=c.esp||'';if(!t.value)t.value=c.cel||''}
function guardarEquipo(pid,xid){const p=pac(pid),g=k=>document.getElementById(k).value.trim();
  const d={nom:g('eq_n'),esp:g('eq_e'),cel:g('eq_c')};if(!d.nom){toast('Escribí el nombre del profesional.');return}
  if(!Array.isArray(p.eq))p.eq=[];const x=p.eq.find(e=>e.id===xid);
  if(x)Object.assign(x,d);else p.eq.push({id:uid(),...d});guardar();cerrar();toast('Equipo terapéutico guardado.');ir('ficha',pid)}
function quitarEquipo(pid,xid){const p=pac(pid),x=equipo(p).find(e=>e.id===xid);
  confirmar('Quitar del equipo','¿Quitar a '+esc(x.nom)+' del equipo terapéutico de este paciente?','Quitar',()=>{p.eq=equipo(p).filter(e=>e.id!==xid);if(!p.eq.length)delete p.eq;guardar();toast('Quitado del equipo.');ir('ficha',pid)},true)}
const esBorr=e=>e.estado==='borrador';
const AVISO_CONF='Revisá que el texto, la fecha y la asistencia estén bien: <b>una vez confirmada, la sesión ya no se puede corregir ni borrar</b>. El cobro sí se puede marcar después.';
function leerCompose(){const O=OPC(),g=id=>{const x=document.getElementById(id);return x?x.value.trim():''};
  let t;if(O.partes)t=PARTES.map(([k,l])=>g('evo_'+k)?l+': '+g('evo_'+k):'').filter(Boolean).join('\n\n');else t=g('evo');
  const as=g('evo_as'),pg=g('evo_pg'),cb=document.getElementById('evo_cb');
  if(!t&&as&&as!=='vino')t=ASIST[as]+'.';
  return {t,as,pg,cb:!!(cb&&cb.checked)}}
function guardarEvo(pid,conf){const c=leerCompose(),f=document.getElementById('evof').value||iso(hoy);
  if(!c.t){toast('Escribí algo sobre la sesión.');return}
  const nueva={id:uid(),pid,fecha:f,texto:c.t,creado:new Date().toISOString()};
  if(c.as)nueva.asist=c.as;if(c.pg&&(vino(nueva)||c.cb)){nueva.pago=c.pg;if(c.cb){nueva.cobrado=true;nueva.cobradoEl=iso(hoy)}}
  const fin=()=>{db.E.push(nueva);guardar();tabF='historia';ir('ficha',pid)};
  if(!conf){nueva.estado='borrador';fin();toast('Borrador guardado. Lo podés corregir hasta confirmarlo.');return}
  confirmar('Confirmar sesión del '+fCorta(f),AVISO_CONF,'Confirmar',()=>{nueva.confirmado=new Date().toISOString();fin();toast('Sesión confirmada.')})}
function editarEvo(id){const e=db.E.find(x=>x.id===id);if(!e||!esBorr(e))return;const O=OPC();
  abrir(`<div class="mh"><h2>Corregir borrador</h2></div><div class="mb">
  <div class="frow"><div class="mfield"><label>Fecha</label><input type="date" id="ee_f" value="${e.fecha}"></div>
  ${O.asist||e.asist?`<div class="mfield"><label>Asistencia <span class="opt">opcional</span></label><select id="ee_as"><option value="">—</option>${Object.entries(ASIST).map(([k,l])=>`<option value="${k}" ${e.asist===k?'selected':''}>${l}</option>`).join('')}</select></div>`:''}</div>
  <div class="mfield"><label>Sesión</label><textarea id="ee_t" style="min-height:160px">${esc(e.texto)}</textarea></div></div>
  <div class="mf"><button class="btn sec" style="margin-right:auto;color:var(--pink)" onclick="borrarEvo('${id}')">Borrar borrador</button><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="guardarEdicion('${id}')">Guardar cambios</button></div>`)}
function guardarEdicion(id){const e=db.E.find(x=>x.id===id),t=document.getElementById('ee_t').value.trim(),f=document.getElementById('ee_f').value,as=document.getElementById('ee_as');
  if(!t){toast('La sesión no puede quedar vacía. Si no la querés, borrala.');return}
  e.texto=t;if(f)e.fecha=f;if(as){if(as.value)e.asist=as.value;else delete e.asist}e.editado=new Date().toISOString();guardar();cerrar();toast('Borrador corregido.');ir('ficha',e.pid)}
function borrarEvo(id){const e=db.E.find(x=>x.id===id);
  confirmar('Borrar borrador','¿Borrar este borrador del '+fCorta(e.fecha)+'? No se puede deshacer.','Borrar',()=>{db.E=db.E.filter(x=>x.id!==id);guardar();toast('Borrador borrado.');ir('ficha',e.pid)},true)}
function confirmarEvo(id){const e=db.E.find(x=>x.id===id);
  confirmar('Confirmar sesión del '+fCorta(e.fecha),AVISO_CONF,'Confirmar',()=>{delete e.estado;e.confirmado=new Date().toISOString();guardar();toast('Sesión confirmada.');ir('ficha',e.pid)})}

/* primera consulta */
function guardarAnam(pid){const p=pac(pid),a={},g=id=>document.getElementById(id).value.trim();
  a.fecha=document.getElementById('an_fecha').value;a.quien=g('an_quien');anamCampos(p.anam).forEach(([k])=>{a[k]=g('an_'+k)});
  for(const k in a)if(!a[k])delete a[k];a.editado=new Date().toISOString();p.anam=a;guardar();toast('Primera consulta guardada.');ir('ficha',pid)}
/* objetivos y evaluaciones */
function nuevoObj(pid){const i=document.getElementById('ob_t'),t=i.value.trim();if(!t){i.focus();return}
  db.Ob.push({id:uid(),pid,texto:t,desde:iso(hoy)});guardar();ir('ficha',pid);setTimeout(()=>{const x=document.getElementById('ob_t');if(x)x.focus()},30)}
function togObj(id){const o=db.Ob.find(x=>x.id===id);if(o.logrado)delete o.logrado;else o.logrado=iso(hoy);guardar();ir('ficha',o.pid)}
function borrarObj(id){const o=db.Ob.find(x=>x.id===id);confirmar('Borrar objetivo','¿Borrar <b>'+esc(o.texto)+'</b>?','Borrar',()=>{db.Ob=db.Ob.filter(x=>x.id!==id);guardar();ir('ficha',o.pid)},true)}
function nuevaEval(pid){const tests=[...new Set(db.V.map(v=>v.test))].sort();
  abrir(`<div class="mh"><h2>Cargar evaluación</h2></div><div class="mb">
  <div class="frow"><div class="mfield"><label>Test o protocolo</label><input id="ev_t" list="ev_l" placeholder="Nombre del test, escala o evaluación"><datalist id="ev_l">${tests.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div><div class="mfield"><label>Fecha</label><input type="date" id="ev_f" value="${iso(hoy)}"></div></div>
  <div class="mfield"><label>Puntaje o resultado <span class="opt">opcional</span></label><input id="ev_p" placeholder="Ej.: 18/40, percentil 25, normal"></div>
  <div class="mfield"><label>Observaciones <span class="opt">opcional</span></label><textarea id="ev_o"></textarea></div></div>
  <div class="mf"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="guardarEval(${pid})">Guardar</button></div>`)}
function guardarEval(pid){const g=id=>document.getElementById(id).value.trim();
  if(!g('ev_t')){toast('Escribí el nombre del test.');return}
  db.V.push({id:uid(),pid,test:g('ev_t'),fecha:g('ev_f')||iso(hoy),puntaje:g('ev_p'),obs:g('ev_o')});guardar();cerrar();toast('Evaluación guardada.');tabF='evalu';ir('ficha',pid)}
function borrarEval(id){const v=db.V.find(x=>x.id===id);confirmar('Borrar evaluación','¿Borrar <b>'+esc(v.test)+'</b> del '+fCorta(v.fecha)+'?','Borrar',()=>{db.V=db.V.filter(x=>x.id!==id);guardar();ir('ficha',v.pid)},true)}
/* eliminar: solo si no tiene sesiones confirmadas (la historia clínica se conserva) */
function eliminarPaciente(pid){const p=pac(pid);if(!p)return;
  const nC=db.E.filter(e=>e.pid==pid&&e.estado!=='borrador').length;
  const nT=db.T.filter(t=>t.pid==pid).length,nB=db.E.filter(e=>e.pid==pid&&e.estado==='borrador').length,nA=db.A.filter(a=>a.pid==pid).length;
  const extra=[nC?nC+' sesi'+(nC>1?'ones confirmadas':'ón confirmada'):'',nT?nT+' turno'+(nT>1?'s':''):'',nB?nB+' borrador'+(nB>1?'es':''):'',nA?nA+' archivo'+(nA>1?'s':''):''].filter(Boolean).join(', ');
  abrir(`<div class="mh"><h2>Eliminar paciente</h2></div><div class="mb">
    <p>¿Eliminar a <b>${esc(nom(p))}</b>${extra?' junto con '+extra:''}? <b>No se puede deshacer.</b></p>
    ${nC?`<p>Tiene <b>sesiones confirmadas</b>: si es un paciente real que atendiste, mejor <b>dalo de alta</b> (su historia clínica queda guardada). Eliminalo solo si lo cargaste de prueba o por error.</p>
    <div class="mfield"><label>Para confirmar, escribí ELIMINAR</label><input id="el_ok" autocomplete="off" style="text-transform:uppercase"></div>`:''}</div>
    <div class="mf"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn danger" onclick="confirmarEliminar(${pid},${nC?1:0})">Eliminar</button></div>`)}
function confirmarEliminar(pid,fuerte){
  if(fuerte&&(document.getElementById('el_ok').value||'').trim().toUpperCase()!=='ELIMINAR'){toast('Escribí ELIMINAR para confirmar.');return}
  for(const k of ['P','T','E','Ob','V','A','S'])db[k]=db[k].filter(x=>k==='P'?x.id!=pid:x.pid!=pid);
  cerrar();guardar();toast('Paciente eliminado.');ir('pacientes')}
/* alta */
function darAlta(pid){const p=pac(pid);abrir(`<div class="mh"><h2>Dar de alta a ${esc(nom(p))}</h2></div><div class="mb">
  <p>Pasa a la lista de "dados de alta": deja de aparecer en los avisos, pero su historia queda guardada y lo podés volver a activar cuando quieras.</p>
  <div class="mfield"><label>Fecha del alta</label><input type="date" id="al_f" value="${iso(hoy)}"></div>
  <div class="mfield"><label>Motivo <span class="opt">opcional</span></label><input id="al_m" placeholder="Ej.: alta por objetivos cumplidos, abandono, se mudó"></div></div>
  <div class="mf"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="guardarAlta(${pid})">Dar de alta</button></div>`)}
function guardarAlta(pid){const p=pac(pid);p.estado='alta';p.fechaAlta=document.getElementById('al_f').value||iso(hoy);p.motivoAlta=document.getElementById('al_m').value.trim();
  guardar();cerrar();toast('Paciente dado de alta.');ir('ficha',pid)}
function reactivar(pid){const p=pac(pid);delete p.estado;delete p.fechaAlta;delete p.motivoAlta;guardar();toast('Volvió a tratamiento.');ir('ficha',pid)}

/* ---------- IMPRESIÓN: historia completa e informes ---------- */
function imprimir(html){const d=document.getElementById('print');d.innerHTML=html;document.body.classList.add('imp');
  setTimeout(()=>{window.print()},60)}
window.addEventListener('afterprint',()=>{document.body.classList.remove('imp');document.getElementById('print').innerHTML=''});
function encabezado(titulo){const mat=esc(espec())+(db.cfg.matricula?' · M.P. '+esc(db.cfg.matricula):'');
  return `<div class="ph1"><div><b>${esc(EST.nombre||'')}</b><br>${mat}</div><div>${fCorta(iso(hoy))}</div></div><h1>${titulo}</h1>`}
const fila=(k,v)=>v?`<tr><td class="k">${k}</td><td>${esc(v)}</td></tr>`:'';
function tablaDatos(p,extra){return `<table>${fila('Paciente',nom(p))}${fila('Fecha de nacimiento',fCorta(p.nac)+' ('+edad(p.nac)+' años)')}${fila('DNI',p.dni)}
  ${fila('Obra social',p.obra+(p.afil?' · N° de afiliado '+p.afil:''))}${fila('Responsable',p.tutor)}${extra.includes('esc')?fila('Escuela',[p.escuela,p.grado].filter(Boolean).join(' · '))+fila('Maestra integradora',p.integradora):''}
  ${fila('Motivo de consulta',p.motivo)}${fila('Diagnóstico médico',p.diag)}${fila('Derivado por',p.deriva)}${fila('Inicio del tratamiento',p.alta?fCorta(p.alta):'')}</table>`}
function firma(){return `<div class="firma"><div>${esc(EST.nombre||'')}<br>${esc(espec())}${db.cfg.matricula?' · M.P. '+esc(db.cfg.matricula):''}</div></div>`}
function bloqueObjetivos(pid){const Ob=db.Ob.filter(o=>o.pid==pid);if(!Ob.length)return '';
  return `<h2>Objetivos del tratamiento</h2><table>${Ob.map(o=>`<tr><td>${esc(o.texto)}</td><td style="width:170px">${o.logrado?'Logrado ('+fCorta(o.logrado)+')':'En proceso'}</td></tr>`).join('')}</table>`}
function bloqueEval(pid,d,h){const V=db.V.filter(v=>v.pid==pid&&(!d||v.fecha>=d)&&(!h||v.fecha<=h)).sort((a,b)=>a.fecha.localeCompare(b.fecha));if(!V.length)return '';
  return `<h2>Evaluaciones</h2>${V.map(v=>`<div class="ses"><b>${fCorta(v.fecha)}</b> ${esc(v.test)}${v.puntaje?' — '+esc(v.puntaje):''}${v.obs?`<p>${esc(v.obs)}</p>`:''}</div>`).join('')}`}
function bloqueSesiones(L){return L.map(e=>`<div class="ses"><b>${fCorta(e.fecha)}</b>${e.asist&&e.asist!=='vino'?' <i>'+ASIST[e.asist]+'</i>':''}${esBorr(e)?' <i>(borrador)</i>':''}<p>${esc(e.texto)}</p></div>`).join('')}
function imprimirHistoria(pid){const p=pac(pid),a=p.anam||{};
  const E=db.E.filter(e=>e.pid==pid).sort((x,y)=>x.fecha.localeCompare(y.fecha));
  const an=anamCampos(a).filter(([k])=>a[k]);
  imprimir(`${encabezado('Historia clínica')}${tablaDatos(p,['esc'])}
    ${an.length||a.fecha?`<h2>Primera consulta${a.fecha?' ('+fCorta(a.fecha)+')':''}${a.quien?' — datos aportados por '+esc(a.quien):''}</h2><table>${an.map(([k,l])=>`<tr><td class="k">${l}</td><td style="white-space:pre-wrap">${esc(a[k])}</td></tr>`).join('')}</table>`:''}
    ${bloqueObjetivos(pid)}${bloqueEval(pid)}
    <h2>Sesiones (${E.length})</h2>${E.length?bloqueSesiones(E):'<p>Sin sesiones registradas.</p>'}
    ${!activo(p)?`<h2>Alta</h2><p>${fCorta(p.fechaAlta)}${p.motivoAlta?' — '+esc(p.motivoAlta):''}</p>`:''}${firma()}`)}
const PARA={obra:'Obra social',escuela:'Escuela',medico:'Médico',otro:'Otro'};
function formInforme(pid){const p=pac(pid);const desde=(p.autDesde&&activo(p))?p.autDesde:(p.alta||iso(addDays(-90)));
  const ch=(id,l,s,on=true)=>`<label class="chk"><input type="checkbox" id="${id}" ${on?'checked':''}><span>${l}${s?`<small>${s}</small>`:''}</span></label>`;
  abrir(`<div class="mh"><h2>Informe de ${esc(nom(p))}</h2></div><div class="mb">
  <div class="frow"><div class="mfield"><label>Para</label><select id="in_para">${Object.entries(PARA).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
    <div class="mfield"><label>Dirigido a <span class="opt">opcional</span></label><input id="in_dest" placeholder="Ej.: APROSS, Esc. Rivadavia, Dr. Pérez"></div></div>
  <div class="frow"><div class="mfield"><label>Período desde</label><input type="date" id="in_d" value="${desde}"></div><div class="mfield"><label>Hasta</label><input type="date" id="in_h" value="${iso(hoy)}"></div></div>
  <div class="mfield"><label>Qué incluir</label>
    ${ch('in_asis','Cantidad de sesiones y asistencia','Sesiones del período, faltas y autorización')}
    ${ch('in_obj','Objetivos del tratamiento','',db.Ob.some(o=>o.pid==pid))}
    ${ch('in_ev','Evaluaciones del período','',db.V.some(v=>v.pid==pid))}
    ${ch('in_ses','Detalle de cada sesión','Fecha y texto de cada sesión del período',false)}</div>
  <div class="mfield"><label>Evolución y sugerencias <span class="opt">opcional</span></label><textarea id="in_txt" style="min-height:120px" placeholder="Lo que quieras contar con tus palabras: cómo avanzó, qué falta, qué sugerís."></textarea></div></div>
  <div class="mf"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="armarInforme(${pid})">${ic('print','sm')}Ver e imprimir</button></div>`,true)}
function armarInforme(pid){const p=pac(pid),g=id=>document.getElementById(id),v=id=>g(id).value.trim(),on=id=>g(id).checked;
  const para=v('in_para'),dest=v('in_dest'),d=v('in_d'),h=v('in_h'),txt=v('in_txt');
  const E=db.E.filter(e=>e.pid==pid&&(!d||e.fecha>=d)&&(!h||e.fecha<=h)).sort((x,y)=>x.fecha.localeCompare(y.fecha));
  const fue=E.filter(vino).length,fa=E.filter(e=>e.asist==='aviso').length,fs=E.filter(e=>e.asist==='sinaviso').length,au=autUso(p);
  const html=`${encabezado(espec()?'Informe de '+espec().toLowerCase():'Informe profesional')}
    <p>${dest?'<b>Para:</b> '+esc(dest)+' ('+PARA[para].toLowerCase()+')<br>':para!=='otro'?'<b>Para:</b> '+PARA[para]+'<br>':''}<b>Período:</b> ${d?'del '+fCorta(d)+' ':''}al ${fCorta(h||iso(hoy))}</p>
    <h2>Datos del paciente</h2>${tablaDatos(p,para==='escuela'?['esc']:[])}
    ${on('in_asis')?`<h2>Asistencia</h2><table>${fila('Sesiones realizadas',String(fue))}${fa?fila('Faltas con aviso',String(fa)):''}${fs?fila('Faltas sin aviso',String(fs)):''}
      ${para==='obra'&&au?fila('Autorización',(p.autNum?'N° '+p.autNum+' · ':'')+(au.tot?au.us+' de '+au.tot+' sesiones utilizadas':'')+(p.autHasta?' · vigente hasta el '+fCorta(p.autHasta):'')):''}</table>`:''}
    ${on('in_obj')?bloqueObjetivos(pid):''}${on('in_ev')?bloqueEval(pid,d,h):''}
    ${txt?`<h2>Evolución y sugerencias</h2><p>${esc(txt)}</p>`:''}
    ${on('in_ses')&&E.length?`<h2>Detalle de sesiones</h2>${bloqueSesiones(E)}`:''}${firma()}`;
  cerrar();imprimir(html)}

/* ---------- ARCHIVOS: carpetas, mover y borrar ---------- */
const CARP_DEF=['Informes de especialistas','Pedidos médicos','Facturación'];
const carpetas=()=>Array.isArray(db.cfg.carpetas)?db.cfg.carpetas:CARP_DEF.slice();
const carpDe=a=>a.carpeta&&carpetas().includes(a.carpeta)?a.carpeta:'';
let carpF='*';
function tabArchivos(p,A){const C=carpetas(),cnt=c=>A.filter(a=>carpDe(a)===c).length,nO=cnt('');
  if(carpF!=='*'&&carpF!==''&&!C.includes(carpF))carpF='*';if(carpF===''&&!nO)carpF='*';
  const chip=(k,l,n)=>`<button class="${carpF===k?'on':''}" onclick="carpF=CARPS[${k==='*'?-1:k===''?-2:C.indexOf(k)}];ir('ficha',${p.id})">${esc(l)}${n?' <span class="n">'+n+'</span>':''}</button>`;
  window.CARPS=Object.assign(C.slice(),{'-1':'*','-2':''});
  const fila=a=>{const u=urlAdj(a),img=/^image\//.test(a.tipo||'')||/\.(jpe?g|png|gif|webp)$/i.test(a.nombre);
    return `<div class="file">${img?`<img class="thumb" src="${u}" alt="">`:`<div class="chip c-blue" style="width:44px;height:44px">${ic('file','sm')}</div>`}
      <div class="grow"><div><b>${esc(a.nombre)}</b></div><div class="s">Agregado el ${fCorta(a.fecha)}</div></div>
      <div class="acts"><a class="btn sm sec" href="${u}" target="_blank">Abrir</a><button class="btn sm sec" onclick="moverArchivo('${a.id}')">Mover</button><button class="btn sm sec icon" title="Borrar archivo" onclick="borrarArchivo('${a.id}')">${ic('x','sm')}</button></div></div>`};
  const grupo=(c,L)=>L.length?`<div class="carp-h">${ic('folder','sm')}${esc(c||'Sin carpeta')}<span>${L.length}</span></div>${L.map(fila).join('')}`:'';
  let lista;
  if(!A.length)lista='<div class="empty">Todavía no hay archivos. Podés sumar fotos de las hojas en papel, estudios, informes, pedidos médicos o facturas.</div>';
  else if(carpF==='*')lista=[...C,''].map(c=>grupo(c,A.filter(a=>carpDe(a)===c))).join('');
  else{const L=A.filter(a=>carpDe(a)===carpF);lista=L.length?L.map(fila).join(''):'<div class="empty">Esta carpeta está vacía.</div>'}
  const dest=carpF==='*'?'':carpF;
  return `<div class="card-b"><div class="carps noprint">${chip('*','Todos',A.length)}${C.map(c=>chip(c,c,cnt(c))).join('')}${nO?chip('','Sin carpeta',nO):''}
      <button class="mas" onclick="editarCarpetas(${p.id})">${ic('folder','sm')}Carpetas</button></div>
    <div class="flist">${lista}</div>
    <div class="subir noprint"><label class="lbl" for="adj_c">Guardar en</label><select id="adj_c">${C.map(c=>`<option ${c===dest?'selected':''}>${esc(c)}</option>`).join('')}<option value="" ${dest===''?'selected':''}>Sin carpeta</option></select>
      <label class="btn sm sec">${ic('clip','sm')}Agregar fotos o PDF<input type="file" multiple hidden accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" onchange="subir(${p.id},this.files)"></label></div></div>`}
const carpSubir=()=>{const e=document.getElementById('adj_c');return e?e.value:''};
function moverArchivo(id){const a=db.A.find(x=>x.id===id);if(!a)return;const C=carpetas(),c=carpDe(a);
  abrir(`<div class="mh"><h2>Mover archivo</h2></div><div class="mb"><p><b>${esc(a.nombre)}</b></p>
    <div class="mfield"><label>Carpeta</label><select id="mv_c">${C.map(x=>`<option ${x===c?'selected':''}>${esc(x)}</option>`).join('')}<option value="" ${c?'':'selected'}>Sin carpeta</option></select></div></div>
    <div class="mf"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="guardarMoverArch('${id}')">Mover</button></div>`)}
function guardarMoverArch(id){const a=db.A.find(x=>x.id===id),c=document.getElementById('mv_c').value;
  if(c)a.carpeta=c;else delete a.carpeta;guardar();cerrar();toast(c?'Movido a '+c+'.':'Movido a Sin carpeta.');ir('ficha',a.pid)}
function borrarArchivo(id){const a=db.A.find(x=>x.id===id);if(!a)return;
  confirmar('Borrar archivo','¿Borrar <b>'+esc(a.nombre)+'</b> de la ficha? Usalo si lo subiste por error. <b>No se puede deshacer.</b>','Borrar',()=>{db.A=db.A.filter(x=>x.id!==id);guardar();toast('Archivo borrado.');ir('ficha',a.pid)},true)}
function filaCarp(n,orig,txt){return `<div class="cp-row"><input value="${esc(n)}" data-orig="${esc(orig)}" maxlength="40"><span class="s">${txt}</span><button class="btn sm sec icon" title="Quitar carpeta" onclick="this.parentNode.remove()">${ic('x','sm')}</button></div>`}
function editarCarpetas(pid){const C=carpetas(),uso=c=>db.A.filter(a=>a.carpeta===c).length;
  abrir(`<div class="mh"><h2>Carpetas de archivos</h2></div><div class="mb">
    <p class="sub">Son las mismas para todos los pacientes. Podés cambiarles el nombre o quitarlas: si quitás una, sus archivos pasan a "Sin carpeta" (no se borran).</p>
    <div id="cp_l">${C.map(c=>filaCarp(c,c,uso(c)+' archivo'+(uso(c)===1?'':'s'))).join('')}</div>
    <div class="cp-row"><input id="cp_n" maxlength="40" placeholder="Nueva carpeta (ej.: Estudios, Escuela)" onkeydown="if(event.key==='Enter')sumarCarpeta()"><button class="btn sm sec" onclick="sumarCarpeta()">${ic('plus','sm')}Agregar</button></div></div>
    <div class="mf"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="guardarCarpetas(${pid})">Guardar</button></div>`)}
function sumarCarpeta(){const i=document.getElementById('cp_n'),n=i.value.trim();if(!n)return;
  document.getElementById('cp_l').insertAdjacentHTML('beforeend',filaCarp(n,'','nueva'));i.value='';i.focus()}
function guardarCarpetas(pid){if(document.getElementById('cp_n').value.trim())sumarCarpeta();
  const filas=[...document.querySelectorAll('#cp_l input')].map(i=>({n:i.value.trim(),o:i.dataset.orig}));
  const nuevas=[];for(const f of filas){if(!f.n){toast('Hay una carpeta sin nombre.');return}if(nuevas.some(x=>x.toLowerCase()===f.n.toLowerCase())){toast('Hay dos carpetas con el nombre "'+f.n+'".');return}nuevas.push(f.n)}
  const ren={};filas.forEach(f=>{if(f.o)ren[f.o]=f.n});
  for(const a of db.A){if(!a.carpeta)continue;if(Object.prototype.hasOwnProperty.call(ren,a.carpeta))a.carpeta=ren[a.carpeta];else delete a.carpeta}
  if(Object.prototype.hasOwnProperty.call(ren,carpF))carpF=ren[carpF];
  db.cfg.carpetas=nuevas;guardar();cerrar();toast('Carpetas guardadas.');tabF='archivos';ir('ficha',pid)}

const urlAdj=a=>urlAdjNube(a);
async function subir(pid,files){files=[...files];if(!files.length)return;const carp=carpSubir();
  toast('Guardando '+files.length+' archivo'+(files.length>1?'s':'')+'…');
  let ok=0;
  for(const f of files){
    if(f.size>40*1024*1024){toast(f.name+' es demasiado grande (máximo 40 MB).');continue}
    try{const j=await api('POST','/api/adjunto?pid='+pid+'&nombre='+encodeURIComponent(f.name),f,true);
      db.A.push({id:uid(),pid,archivo:j.archivo,nombre:f.name,tipo:f.type,fecha:iso(hoy),subido:new Date().toISOString(),...(carp?{carpeta:carp}:{})});ok++}
    catch(e){toast('No se pudo guardar '+f.name+': '+e.message)}}
  if(ok){await guardar();toast(ok===1?'Archivo guardado.':ok+' archivos guardados.')}
  tabF='archivos';ir('ficha',pid)}

/* ---------- AGENDA ---------- */
let agVista='lista',mesOff=0;try{agVista=localStorage.getItem('mas-agenda')||'lista'}catch(e){}
function setAgVista(v){agVista=v;try{localStorage.setItem('mas-agenda',v)}catch(e){}ir('agenda')}
const selVista=()=>`<div class="seg" title="Cómo ver la agenda"><button class="${agVista==='lista'?'on':''}" onclick="setAgVista('lista')">Lista</button><button class="${agVista==='cal'?'on':''}" onclick="setAgVista('cal')">Calendario</button></div>`;
const MESES_C=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function calendario(){
  const m0=new Date(hoy.getFullYear(),hoy.getMonth()+mesOff,1),mes=m0.getMonth();
  const ini=new Date(m0);ini.setDate(1-((m0.getDay()+6)%7));   // arranca en lunes
  const porDia={};for(const t of db.T){if(pac(t.pid))(porDia[t.fecha]=porDia[t.fecha]||[]).push(t)}
  let celdas='',d=new Date(ini),nMes=0;
  for(let i=0;i<42;i++){const f=iso(d),T=(porDia[f]||[]).sort((a,b)=>a.hora.localeCompare(b.hora)),fuera=d.getMonth()!==mes,esHoy=f===iso(hoy);
    if(!fuera)nMes+=T.length;
    celdas+=`<button class="cal-d${fuera?' fuera':''}${esHoy?' hoy':''}${T.length?' con':''}" onclick="verDia('${f}')"><span class="cal-n">${d.getDate()}</span>
      <span class="cal-t">${T.slice(0,3).map(t=>`<span class="cal-i${t.serie?' fijo':''}"><b>${t.hora}</b> ${esc(pac(t.pid).nombre)}</span>`).join('')}${T.length>3?`<span class="cal-mas">+${T.length-3} más</span>`:''}</span>
      ${T.length?`<span class="cal-c">${T.length}</span>`:''}</button>`;
    d.setDate(d.getDate()+1);if(i===34&&d.getMonth()!==mes)break}
  return `<div class="ph"><div><h1>Agenda</h1><p>${MESES_C[mes]} ${m0.getFullYear()} · ${nMes} turno${nMes===1?'':'s'}</p></div><div class="acts">${selVista()}
    <div class="wk"><button class="btn sec icon" title="Mes anterior" onclick="mesOff--;ir('agenda')">${ic('left','sm')}</button>${mesOff!==0?`<button class="btn sec" onclick="mesOff=0;ir('agenda')">Hoy</button>`:''}<button class="btn sec icon" title="Mes siguiente" onclick="mesOff++;ir('agenda')">${ic('right','sm')}</button></div>
    <button class="btn" onclick="nuevoTurno()">${ic('plus','sm')}Nuevo turno</button></div></div>
    <div class="card cal"><div class="cal-h">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-g">${celdas}</div></div>`}
function verDia(f){const T=db.T.filter(t=>t.fecha===f&&pac(t.pid)).sort((a,b)=>a.hora.localeCompare(b.hora));
  abrir(`<div class="mh"><h2>${may(fLarga(parse(f)))}</h2></div><div class="mb">
    ${T.length?T.map(t=>{const p=pac(t.pid);return `<div class="row"><div class="hora">${t.hora}</div><div class="grow"><div class="t">${esc(nom(p))}${t.serie?' <span class="pill teal">Fijo</span>':''}</div><div class="s">${esc(p.motivo)}</div></div>
      <div class="acts"><button class="btn sm sec" title="Recordatorio por WhatsApp" onclick="recordar('${t.id}')">${ic('msg','sm')}</button><button class="btn sm sec" onclick="moverTurno('${t.id}')">Cambiar</button><button class="btn sm sec" onclick="cerrar();tabF='historia';ir('ficha',${p.id})">Ficha</button><button class="btn sm sec icon" title="Cancelar turno" onclick="cancelarTurno('${t.id}')">${ic('x','sm')}</button></div></div>`}).join(''):'<div class="empty">No hay turnos este día.</div>'}</div>
    <div class="mf"><button class="btn sec" onclick="cerrar()">Cerrar</button><button class="btn" onclick="nuevoTurno(undefined,'${f}')">${ic('plus','sm')}Dar turno este día</button></div>`,true)}
function agenda(){if(agVista==='cal')return calendario();let h='';const base=semana*7;
  for(let i=base;i<base+7;i++){const d=addDays(i),T=db.T.filter(t=>t.fecha===iso(d)&&pac(t.pid)).sort((a,b)=>a.hora.localeCompare(b.hora));
    if(d.getDay()===0&&!T.length)continue;

/* ================================================================
   MAS Consultorios ONLINE — los datos viven en el Google Drive de cada profesional.
   Se agrega DESPUÉS de src/app.js: las funciones con el mismo nombre reemplazan
   a las del programa local. Los datos son el mismo JSON {v,P,E,T,A,V,Ob,S,cfg}.
   - Entrar: Google (Supabase guarda solo la identidad para la licencia).

const SCOPES='https://www.googleapis.com/auth/drive.file email';
let GTOK=null,GEXP=0,EMAIL='',LIC=null,tokCli=null,tokCb=null;
/* el permiso de Google dura ~1 h: se guarda en este aparato para volver a entrar de una sin tocar nada */
function guardarTok(){try{GTOK&&EMAIL?localStorage.setItem('mas-gtok',JSON.stringify({e:EMAIL,t:GTOK,x:GEXP})):localStorage.removeItem('mas-gtok')}catch(e){}}
function olvidarTok(){GTOK=null;try{localStorage.removeItem('mas-gtok')}catch(e){}}
function tokGuardado(){try{const o=JSON.parse(localStorage.getItem('mas-gtok')||'null');if(o&&o.e===EMAIL&&o.t&&o.x>Date.now()+120000)return o}catch(e){}return null}
let CARP=null,HIST=null,ADJ=null,ARCH=null,VERS=null,BASE='null',ULT=null,PEND=false,GUARDANDO=false,ERRG=null,ultHist=0;
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const lsSet=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};

function msj(e){const m=(e&&e.message)||String(e||'');
  if(m==='reconectar')return 'Hay que reconectar Google.';
  if(m==='drive-lleno')return 'Tu Google Drive está lleno.';
  if(!navigator.onLine||/failed to fetch|network|load failed/i.test(m))return 'No hay conexión a internet.';
  return m||'Error inesperado.'}
const esRed=e=>!navigator.onLine||/failed to fetch|network|load failed/i.test((e&&e.message)||'');
